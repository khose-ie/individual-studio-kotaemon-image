name: Build Docker

on:
  push:
    branches:
    - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      REPO: khose
      IMAGE: kotaemon

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: false
        tags: ${{ env.REPO }}/${{ env.IMAGE }}:dev
        file: ${{ github.workspace }}/Dockerfile.khose
