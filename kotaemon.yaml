services:

    kotaemon:
        build:
            context: .
            dockerfile: Dockerfile
        image: kotaemon:dev
        container_name: individual-studio-kotaemon
        restart: unless-stopped
        environment:
            - GRADIO_SERVER_NAME=0.0.0.0
            - GRADIO_SERVER_PORT=7860
        volumes:
            - kotaemon:/app/ktem_app_data
        ports:
            - "7860:7860"

networks:
    kotaemon:
        name: individual-studio-kotaemon

volumes:
    kotaemon:
        name: individual-studio-kotaemon
